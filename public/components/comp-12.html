(function() {

      if (img.src !== replacement) {

        img.removeAttribute("loading");
        img.loading = "eager";

      if (!parent || parent.closest(".mk-comp-topbar") || parent.closest(".mk-lang-bar")) continue;
      const tag = parent.tagName.toLowerCase();
      if (tag === "script" || tag === "style" || tag === "noscript") continue;
      let raw = cleanText(node.nodeValue);
      if (!raw) continue;

      if (raw === "/" || /^0\d$/.test(raw)) {
        node.nodeValue = "";
        continue;
      }

      if (node.__mkBound) continue;
      for (let i = 0; i < DATA.phrases.length; i++) {
        const p = DATA.phrases[i];
        const matched = p.exact
          ? raw.toLowerCase() === p.match.toLowerCase()
          : raw.toLowerCase().includes(p.match.toLowerCase());
        if (matched) {
          node.__mkBound = true;
          boundNodes.push({ node: node, phrase: p });
          node.nodeValue = p[lang] || p.mk;
          break;
        }
      }
    }
  }

  document.addEventListener("click", function(e) {
    const btn = e.target.closest(".mk-lang-btn");
    if (btn) {
      e.preventDefault();
      translateNodes(btn.getAttribute("data-lang"));
    }
  }, true);

  window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "mk-set-lang" && e.data.lang) {
      translateNodes(e.data.lang);
    }
  });

  setTimeout(function() {
    translateNodes(currentLang);
  }, 1100);
  setTimeout(function() {
    translateNodes(currentLang);
  }, 2200);
})();
</script>

<script>
setTimeout(function() {
  try {
    if (window.location.protocol !== "file:" && window.self === window.top) {
      var orig = window.__origPath || location.pathname;
      var isSub = orig.indexOf("/macedonia-landing-pages") !== -1;
      var targetPath = (isSub ? "/macedonia-landing-pages/" : "/") + "comp-12.html";
      history.replaceState(null, "", targetPath);
    }
  } catch(e) {}
}, 1400);
</script>
<script>
window.addEventListener("DOMContentLoaded", function() {
  const isFile = window.location.protocol === "file:";
  if (isFile || !window.location.pathname.includes("/macedonia-landing-pages")) {
    document.querySelectorAll(".mk-hub-link").forEach(a => a.href = "index.html");
    document.querySelectorAll('a[href^="/macedonia-landing-pages/"]').forEach(a => {
      a.href = a.getAttribute("href").replace("/macedonia-landing-pages/", "");
    });
  }
});
</script>

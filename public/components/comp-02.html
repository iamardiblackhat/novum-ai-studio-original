<script>
(function() {
  const DATA = {"comp_file": "comp-02.html", "site_file": "02-winery.html", "comp_name": "Parallax Image Carousel (parallaxcarousel.framer.website)", "biz_name": "Vinarija Sonce (Kavadarci)", "title": {"en": "Tikveš Reserve Vintages — Interactive Parallax Gallery", "mk": "Тиквешки Резерва берби — Интерактивна паралакс галерија", "sq": "Verërat Rezervë Tikvesh — Galeri Interaktive Paralaks"}, "sub": {"en": "Drag or scroll through Vinarija Sonce's oak barrel cellar, Vranec vineyards, and private tasting salons in Kavadarci.", "mk": "Повлечете низ визбата со дабови буриња, лозјата со Вранец и дегустациската сала на Винарија Сонце во Кавадарци.", "sq": "Rrëshqitni përmes bodrumit me fuçi lisi dhe vreshtave Vranec të Kantinës Sonce në Kavadar."}, "phrases": [], "img_swaps": ["https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&fit=crop&w=1200&q=85", "https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=1200&q=85", "https://images.unsplash.com/photo-1560493676-04071c5f467b?auto=format&fit=crop&w=1200&q=85", "https://images.unsplash.com/photo-1504279577054-acfeccf8fc52?auto=format&fit=crop&w=1200&q=85", "https://images.unsplash.com/photo-1596363505729-4190a9506133?auto=format&fit=crop&w=1200&q=85", "https://images.unsplash.com/photo-1516594915697-87eb3b1c14ea?auto=format&fit=crop&w=1200&q=85"]};
  let currentLang = "mk";
  const boundNodes = [];

  function cleanText(s) {
    return (s || "").replace(/\s+/g, " ").trim();
  }

  function stripPromosAndSlashNumbers() {
    const promoTexts = ["copy component", "unlock for $199", "unlock 54+ templates", "more components", "buy component", "get component", "remix"];
    document.querySelectorAll("a, button, p, span, div").forEach(el => {
      if (el.closest(".mk-comp-topbar") || el.closest(".mk-lang-bar")) return;
      const t = cleanText(el.textContent).toLowerCase();
      if (promoTexts.includes(t)) {
        const box = el.closest('a, button, [style*="position: fixed"], [style*="position:fixed"]') || el;
        box.style.setProperty("display", "none", "important");
      }
    });
    // Ensure any opacity:0 cards inside Team Folio Pro are visible
    document.querySelectorAll(".pmR1mlp-card > div").forEach(el => {
      el.style.opacity = "1";
    });
  }

  function swapPhotosAndVideos() {
    if (!DATA.img_swaps || !DATA.img_swaps.length) return;
    const main = document.getElementById("main") || document.body;
    let idx = 0;
    main.querySelectorAll("img").forEach(img => {
      const src = img.getAttribute("src") || "";
      if (src.includes(".svg")) return;
      const replacement = DATA.img_swaps[idx % DATA.img_swaps.length];
      idx++;
      if (img.src !== replacement) {
        img.removeAttribute("srcset");
        img.removeAttribute("loading");
        img.loading = "eager";
        img.src = replacement;
      }
    });
    main.querySelectorAll("video").forEach(vid => {
      const parent = vid.parentElement;
      if (parent && !parent.dataset.mkVidSwapped) {
        const replacement = DATA.img_swaps[idx % DATA.img_swaps.length];
        idx++;
        parent.dataset.mkVidSwapped = "1";
        parent.style.position = parent.style.position || "relative";
        const overlayImg = document.createElement("img");
        overlayImg.src = replacement;
        overlayImg.style.cssText = "position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2;pointer-events:none;display:block;";
        parent.appendChild(overlayImg);
        vid.style.opacity = "0";
        try { vid.pause(); } catch(e) {}
      }
    });
  }

  function translateNodes(lang) {
    currentLang = lang;
    const tEl = document.getElementById("mk-comp-t");
    if (tEl && DATA.title[lang]) tEl.textContent = DATA.title[lang];
    document.querySelectorAll(".mk-lang-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-lang") === lang);
    });

    stripPromosAndSlashNumbers();
    swapPhotosAndVideos();

    boundNodes.forEach(item => {
      if (item.node && item.node.isConnected) {
        const val = item.phrase[lang] || item.phrase.mk;
        if (item.node.nodeValue !== val) item.node.nodeValue = val;
      }
    });

    const main = document.getElementById("main") || document.body;
    const walker = document.createTreeWalker(main, NodeFilter.SHOW_TEXT, null);
    let node;
    while ((node = walker.nextNode())) {
      const parent = node.parentElement;
      if (!parent || parent.closest(".mk-comp-topbar") || parent.closest(".mk-lang-bar")) continue;
      const tag = parent.tagName.toLowerCase();
      if (tag === "script" || tag === "style" || tag === "noscript") continue;
      let raw = cleanText(node.nodeValue);
      if (!raw) continue;

      if (raw === "/" || /^0\d$/.test(raw)) {
        node.nodeValue = "";
        continue;
      }

      if (node.__mkBound) continue;
      for (let i = 0; i < DATA.phrases.length; i++) {
        const p = DATA.phrases[i];
        const matched = p.exact
          ? raw.toLowerCase() === p.match.toLowerCase()
          : raw.toLowerCase().includes(p.match.toLowerCase());
        if (matched) {
          node.__mkBound = true;
          boundNodes.push({ node: node, phrase: p });
          node.nodeValue = p[lang] || p.mk;
          break;
        }
      }
    }
  }

  document.addEventListener("click", function(e) {
    const btn = e.target.closest(".mk-lang-btn");
    if (btn) {
      e.preventDefault();
      translateNodes(btn.getAttribute("data-lang"));
    }
  }, true);

  window.addEventListener("message", function(e) {
    if (e.data && e.data.type === "mk-set-lang" && e.data.lang) {
      translateNodes(e.data.lang);
    }
  });

  setTimeout(function() {
    translateNodes(currentLang);
  }, 1100);
  setTimeout(function() {
    translateNodes(currentLang);
  }, 2200);
})();
</script>
